[package]
name = "dregs"
version = "0.2.0"
edition = "2024"
description = "Solidity mutation testing runner for Foundry projects"
repository = "https://github.com/EspressoSystems/dregs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
gambit = { git = "https://github.com/Certora/gambit", tag = "v1.0.6" }
glob = "0.3.4"
toml = "1.1.8"
rayon = "1.12.0"
regex = "1.13.1"
env_logger = "0.11.11"
log = "0.4.34"

[dev-dependencies]
assert_cmd = "2.2.2"
assert_fs = "1.1.4"
predicates = "3.1.4"
pretty_assertions = { version = "1.4.1", features = ["unstable"] }
